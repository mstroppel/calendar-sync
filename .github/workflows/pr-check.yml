name: PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Build Docker image
        run: docker build --tag calendar-sync:pr --file src/Rafatz.CalendarSync.Worker/Dockerfile src

      - name: Verify container startup
        run: sh .github/scripts/docker-smoke-test.sh calendar-sync:pr
